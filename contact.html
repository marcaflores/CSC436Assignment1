<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header>
  <!--Hero-->
  <div class="hero">
    <div class="container hero-simple">
      <h1>Contact Me</h1>
      <p>Get in touch.</p>
    </div>
  </div>
  <!--navbar-->
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">Home</a>
      <a class="navbar-brand" href="projects.html">Projects</a>
      <a class="navbar-brand" href="contact.html" aria-current="page">Contact Me</a>
      <a class="navbar-brand" href="resume.html">Resume</a>
    </div>
  </nav>
</header>

<main id="main-content">
  <section class="panel contact-info">
    <h2>Message Me</h2>
    <p>LinkedIn: <a href="https://www.linkedin.com/in/marcfloresmendoza" target="_blank" rel="noopener noreferrer">linkedin.com/in/marcfloresmendoza</a></p>
    <p>Email: marcanthflores@gmail.com</p>
  </section>

  <section class="panel">
    <h2>Or send me a message directly</h2>
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send</button>
    </form>
  </section>
</main>

<footer>

</body>
