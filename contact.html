<main>
    
  <section class="container">
    <div class="platforms mb-4">
      <h2>Messgae Me</h2>
      <p>LinkedIn: <a href="https://www.linkedin.com/in/marcfloresmendoza" target="_blank" rel="noopener noreferrer">linkedin.com/in/marcfloresmendoza</a></p>
      <p>Email: marcanthflores@gmail.com</p>
    </div>
<h3>Or send me a message directly:</h3>
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit">Send</button>
    </form>
  </section>
